# The Linux AppImage (x86_64): Hookshot Builder with the compiler, Python, libraries and the Vulkan back end it builds the
# game with on the player's PC (scripts/linux/deps.sh, scripts/linux/appimage.sh). No game data is involved.
# Built in Ubuntu 22.04, the oldest system it is for (glibc 2.35). A workflow artifact on every run; for a release, also
# an asset of its release (scripts/release_upload.sh, shared with the Windows builder workflow). A release is a tag
# pushed by hand, or the tag the Release workflow passes when it calls this one (inputs.tag). On any other push to main,
# the same files replace those of the nightly prerelease, the latest development build.
name: Linux AppImage
on:
  push:
    branches: [main, dev]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: the release's tag, already created; it is checked out and its release gets the files
        type: string
        required: true
permissions:
  contents: read
env:
  # (the release this run is for: the tag passed by the Release workflow, or a pushed tag; empty on other runs)
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
concurrency:
  group: linux-appimage-${{ inputs.tag || github.ref }}
  # (a pull request's older run is cancelled; a push's or a tag's never is)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    # (builder-parts holds the installer's parts: no AppImage there, and it must never be made "latest")
    # (nightly is moved by the release job of a push to main, never built as a tag)
    if: github.ref_name != 'builder-parts' && github.ref_name != 'linux-parts' && github.ref_name != 'nightly'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    # (about 4 minutes with the dependencies cached; building them all takes longer)
    timeout-minutes: 45
    steps:
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # (libstdc++ 13, from the toolchain PPA: the Vulkan back end's C++20 needs <format>; linked in statically)
          apt-get install -y --no-install-recommends software-properties-common gpg-agent
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get install -y --no-install-recommends g++-13 libstdc++-13-dev
          apt-get install -y --no-install-recommends git ca-certificates curl xz-utils zstd file unzip python3 \
            build-essential gcc-12 g++-12 libstdc++-12-dev nasm meson ninja-build cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libxft-dev libfontconfig1-dev zlib1g-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # (a release's tag: the AppImage is named by git describe)
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-linux/deps
          key: linux-deps-${{ hashFiles('scripts/linux/deps.sh') }}

      - name: Dependencies (LLVM, Python, FFmpeg with dav1d, SDL2, Vulkan headers)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/linux/deps.sh

      # work/: the lists and the play profile made on the development PC (addresses and counts, no game code). When the
      # repository does not carry them, the ones in the latest release's app part (named by its hookshot-setup.txt) are
      # used; without either the game is built all the same, a little slower in play.
      # (not this tag's own release: the Windows builder workflow can make it before this step runs. A fork with no release
      # takes upstream's. Downloads are retried: GitHub answers 504 now and then)
      - name: Play profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f work/hot_order.txt ]; then echo "work/ is in the repository"; exit 0; fi
          python3 -I scripts/release_parts.py previous /tmp/setup.txt --repo "$GITHUB_REPOSITORY" --repo NotRexed/Hookshot \
            --skip-tag "$RELEASE_TAG" ||
            { echo "no release with a setup list: built without the profile"; exit 0; }
          python3 -I scripts/release_parts.py profile /tmp/setup.txt work ||
            { echo "the profile did not download: built without it"; exit 0; }
          ls -la work work/image

      - name: AppImage
        run: scripts/linux/appimage.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hookshot-linux-x86_64
          path: build-linux/*.AppImage
          if-no-files-found: error

      # (the update parts of a release or of the nightly, for the release job: scripts/linux/make_parts.py. Not on other
      # runs: about 240 MB)
      - if: env.RELEASE_TAG != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Hookshot-linux-parts
          path: build-linux/parts/
          if-no-files-found: error

  release:
    name: Release asset
    if: >-
      inputs.tag != '' || (startsWith(github.ref, 'refs/tags/') && github.ref_name != 'builder-parts'
      && github.ref_name != 'linux-parts' && github.ref_name != 'nightly') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Hookshot-linux-x86_64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Hookshot-linux-parts
          path: dist/parts
      # (the parts to the linux-parts release, which is never "latest"; a part already there is not uploaded again)
      - name: Update parts
        run: scripts/linux/publish_parts.sh dist/parts
      # (the Release workflow's draft release, or for a tag pushed by hand the release made here or by the Windows
      # builder workflow, whichever is first; a -rc tag is a prerelease and never "latest")
      - name: AppImage to the release
        # (a push to main that is not a release: the nightly)
        run: scripts/release_upload.sh "${RELEASE_TAG:-nightly}" dist/*.AppImage dist/parts/hookshot-linux.txt
