# Every game-free check, on every pull request to main and every push to main: tests/run_all.py runs each
# tests/test_*.py and nx2/test_*.py (all of them, even after a failure), the C++ unit tests under gpu/vk/tests and a
# byte-compile of every tracked Python file, and writes a table of them to the run's summary. Its skip list says which
# checks need a GPU, the game or MSVC, and why. No game data is involved.
